[package]
name = "memo-box"
version = "0.1.0"
description = "纯本地 Markdown 笔记桌面应用"
authors = ["MemoBox"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "memo_box_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.16"
